<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Instagram Feed — V3 Content Studio</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{--nd:#09081A;--nb:#111F35;--nc:#162744;--nm:#243A66;--g:#C9A84C;--gl:#E8C97A;--cr:#F0ECE4;--mt:#7A8FA8;}
body{font-family:'DM Sans',sans-serif;background:var(--nd);color:var(--cr);min-height:100vh;font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased;}

header{padding:16px 28px;border-bottom:1px solid rgba(201,168,76,.12);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;background:rgba(9,8,26,.97);backdrop-filter:blur(8px);}
.hl{display:flex;align-items:center;gap:14px;}
.hl img{height:30px;}
.bc{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--mt);}
.bc a{color:var(--mt);text-decoration:none;}.bc a:hover{color:var(--cr);}
.bc strong{color:var(--cr);font-weight:600;}
.hb{font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;padding:5px 12px;background:rgba(201,168,76,.08);border:1px solid rgba(201,168,76,.25);color:var(--g);}

.wrap{display:grid;grid-template-columns:340px 1fr;min-height:calc(100vh - 57px);}
.lp{border-right:1px solid rgba(201,168,76,.1);overflow-y:auto;max-height:calc(100vh - 57px);}
.ps{padding:18px;border-bottom:1px solid rgba(240,236,228,.05);}
.pt{font-size:10px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--g);margin-bottom:12px;}

label{display:block;font-size:11px;font-weight:600;color:var(--mt);letter-spacing:.5px;margin-bottom:5px;}
select,input[type=text],textarea{width:100%;background:var(--nc);border:1px solid rgba(201,168,76,.15);color:var(--cr);font-family:'DM Sans',sans-serif;font-size:13px;padding:9px 12px;outline:none;transition:border-color .2s;}
select:focus,input:focus,textarea:focus{border-color:rgba(201,168,76,.4);}
textarea{resize:vertical;min-height:72px;line-height:1.5;}
.f{margin-bottom:12px;}

.itabs{display:flex;border:1px solid rgba(201,168,76,.15);margin-bottom:10px;}
.itab{flex:1;padding:7px 4px;font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;text-align:center;cursor:pointer;color:var(--mt);background:transparent;border:none;font-family:'DM Sans',sans-serif;transition:all .2s;}
.itab.active{background:rgba(201,168,76,.1);color:var(--g);}
.itp{display:none;}.itp.active{display:block;}

.ag{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;}
.at{aspect-ratio:1;cursor:pointer;border:2px solid transparent;transition:border-color .2s;position:relative;overflow:hidden;}
.at.sel{border-color:var(--g);}
.al{position:absolute;bottom:0;left:0;right:0;padding:4px 5px;background:rgba(9,8,26,.82);font-size:8px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--cr);}

.bg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;}
.bt{aspect-ratio:1;cursor:pointer;border:2px solid transparent;overflow:hidden;position:relative;background:var(--nc);}
.bt img{width:100%;height:100%;object-fit:cover;}.bt.sel{border-color:var(--g);}
.bd{position:absolute;top:3px;right:3px;width:18px;height:18px;background:rgba(9,8,26,.85);display:flex;align-items:center;justify-content:center;font-size:9px;color:var(--cr);opacity:0;transition:opacity .2s;cursor:pointer;}
.bt:hover .bd{opacity:1;}
.be{font-size:12px;color:var(--mt);text-align:center;padding:16px 0;}
.uz{border:2px dashed rgba(201,168,76,.2);padding:22px 14px;text-align:center;cursor:pointer;transition:border-color .2s;}
.uz:hover{border-color:rgba(201,168,76,.45);}
.uz p{font-size:12px;color:var(--mt);margin-bottom:5px;}
.uh{font-size:10px;color:rgba(122,143,168,.5);}
#fi{display:none;}

.gb{padding:14px 18px;background:var(--nc);border-top:1px solid rgba(201,168,76,.12);position:sticky;bottom:0;}
.gb button{width:100%;padding:12px;font-family:'DM Sans',sans-serif;font-size:12px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;background:var(--g);color:var(--nd);border:none;cursor:pointer;transition:background .2s;}
.gb button:hover{background:var(--gl);}

.rp{padding:28px 32px;display:flex;flex-direction:column;align-items:center;background:var(--nb);overflow-y:auto;}
.ph{width:100%;max-width:460px;display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;}
.pt2{font-size:10px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--g);}
.pa{display:flex;gap:8px;}
.btn{font-family:'DM Sans',sans-serif;font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;padding:9px 16px;cursor:pointer;border:none;transition:all .2s;}
.bg2{background:var(--g);color:var(--nd);}.bg2:hover{background:var(--gl);}
.bo{background:transparent;color:var(--g);border:1px solid rgba(201,168,76,.35);}.bo:hover{background:rgba(201,168,76,.08);}
.bgh{background:transparent;color:var(--mt);border:1px solid rgba(122,143,168,.2);}.bgh:hover{border-color:rgba(122,143,168,.4);color:var(--cr);}

.igf{width:390px;background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.5);}
.igh{background:#fff;padding:10px 14px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #efefef;}
.iga{width:32px;height:32px;border-radius:50%;background:var(--nd);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.iga img{width:26px;height:auto;}
.ign{font-size:12px;font-weight:700;color:#111;font-family:-apple-system,sans-serif;}
.igs{font-size:11px;color:#8e8e8e;font-family:-apple-system,sans-serif;}
.igv{width:390px;height:390px;overflow:hidden;position:relative;background:var(--nd);}
#post-canvas{width:100%;height:100%;}
.igd{display:flex;align-items:center;gap:14px;padding:10px 14px 4px;background:#fff;}
.igico{width:22px;height:22px;color:#111;cursor:pointer;}
.igc{padding:4px 14px 12px;background:#fff;}
.igc p{font-size:13px;color:#111;font-family:-apple-system,sans-serif;}
.igc p strong{font-weight:700;}

.eb{width:100%;max-width:460px;margin-top:20px;background:var(--nc);border:1px solid rgba(201,168,76,.1);padding:16px;}
.et{font-size:10px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--g);margin-bottom:12px;}
.ea{display:flex;gap:8px;flex-wrap:wrap;}

.toast{position:fixed;bottom:22px;right:22px;background:var(--g);color:var(--nd);padding:11px 18px;font-size:11px;font-weight:700;letter-spacing:1px;transform:translateY(70px);opacity:0;transition:all .3s;z-index:999;}
.toast.show{transform:translateY(0);opacity:1;}
</style>
</head>
<body>

<header>
  <div class="hl">
    <img src="../../assets/logos/v3-logo-3d-alpha.png" alt="V3 Partners" onerror="this.style.display='none'">
    <nav class="bc">
      <a href="../../index.html">Content Studio</a>
      <span>›</span>
      <strong>Instagram Feed</strong>
    </nav>
  </div>
  <div class="hb">1080 × 1350 · 4:5</div>
</header>

<div class="wrap">
  <aside class="lp">

    <div class="ps">
      <div class="pt">Configuração</div>
      <div class="f"><label>Tema</label>
        <select id="sel-tema">
          <option value="securitizacao">Securitização &amp; Crédito</option>
          <option value="real-estate">Real Estate Estruturado</option>
          <option value="mineracao">Mineração &amp; Commodities</option>
          <option value="ma-crossborder">M&amp;A Cross-Border</option>
          <option value="tokenizacao">Tokenização de Ativos</option>
          <option value="partners">Rede de Partners</option>
        </select>
      </div>
      <div class="f"><label>Tipo de post</label>
        <select id="sel-tipo">
          <option value="citacao">Citação / Frase</option>
          <option value="dado">Dado / Estatística</option>
          <option value="dica">Dica / Insight</option>
          <option value="anuncio">Anúncio / Novidade</option>
          <option value="deal">Deal / Oportunidade</option>
        </select>
      </div>
      <div class="f"><label>Handle</label>
        <input type="text" id="inp-handle" value="@eujoaolemosnetto">
      </div>
    </div>

    <div class="ps">
      <div class="pt">Conteúdo</div>
      <div class="f"><label>Tag / Label</label>
        <input type="text" id="inp-tag" placeholder="ex: SECURITIZAÇÃO">
      </div>
      <div class="f"><label>Headline</label>
        <input type="text" id="inp-hl" placeholder="Frase principal do post">
      </div>
      <div class="f"><label>Corpo</label>
        <textarea id="inp-body" placeholder="Texto de apoio, dados ou contexto..."></textarea>
      </div>
      <div class="f"><label>Rodapé (opcional)</label>
        <input type="text" id="inp-footer" placeholder="ex: V3 Partners · Securitização">
      </div>
    </div>

    <div class="ps">
      <div class="pt">Imagem de Fundo</div>
      <div class="itabs">
        <button class="itab active" data-tab="abs">Abstratos</button>
        <button class="itab" data-tab="bco">Banco V3</button>
        <button class="itab" data-tab="upl">Upload</button>
      </div>
      <div class="itp active" id="tab-abs"><div class="ag" id="abs-grid"></div></div>
      <div class="itp" id="tab-bco">
        <div class="bg" id="bank-grid">
          <div class="be" id="be">Nenhuma imagem.<br>Adicione via Upload.</div>
        </div>
      </div>
      <div class="itp" id="tab-upl">
        <div class="uz" id="uz"><p>Arraste ou clique para selecionar</p><p class="uh">PNG · JPG — máx 8MB</p><input type="file" id="fi" accept="image/*"></div>
      </div>
    </div>

    <div class="gb"><button id="btn-gerar">Gerar Post</button></div>
  </aside>

  <div class="rp">
    <div class="ph">
      <span class="pt2">Preview</span>
      <div class="pa"><button class="btn bgh" id="btn-copy">Copiar HTML</button></div>
    </div>

    <div class="igf">
      <div class="igh">
        <div class="iga">
          <img src="../../assets/logos/v3-symbol-gold-alpha.png" alt="V3" onerror="this.style.display='none'">
        </div>
        <div style="flex:1;">
          <div class="ign" id="ig-name">eujoaolemosnetto</div>
          <div class="igs">V3 Partners</div>
        </div>
        <span style="font-size:18px;color:#111;cursor:pointer;">···</span>
      </div>
      <div class="igv" id="post-preview"></div>
      <div class="igd">
        <svg class="igico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
        <svg class="igico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        <svg class="igico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        <svg class="igico" style="margin-left:auto;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
      </div>
      <div class="igc">
        <p><strong id="cap-h">eujoaolemosnetto</strong> <span id="cap-t">V3 Partners</span></p>
        <span style="font-size:12px;color:#8e8e8e;font-family:-apple-system,sans-serif;">AGORA MESMO</span>
      </div>
    </div>

    <div class="eb">
      <div class="et">Exportar</div>
      <div class="ea">
        <button class="btn bg2" id="btn-export-png">Exportar PNG (1080×1350)</button>
        <button class="btn bo" id="btn-dl">Baixar HTML</button>
      </div>
      <div id="exp-prog" style="display:none;margin-top:10px;">
        <div style="height:3px;background:rgba(201,168,76,.15);border-radius:2px;overflow:hidden;">
          <div id="exp-bar" style="height:100%;width:0%;background:#C9A84C;border-radius:2px;transition:width .4s;"></div>
        </div>
        <p style="font-size:10px;color:var(--mt);margin-top:5px;" id="exp-label">Gerando PNG...</p>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ── HELPERS SVG ───────────────────────────────────────────────────────────────
function radLines(cx,cy,n,r){return Array.from({length:n},(_,i)=>{const a=Math.PI*2*i/n;return`<line x1="${cx}" y1="${cy}" x2="${(cx+r*Math.cos(a)).toFixed(1)}" y2="${(cy+r*Math.sin(a)).toFixed(1)}"/>`;}).join('');}
function radDots(cx,cy,r,n){return Array.from({length:n},(_,i)=>{const a=Math.PI*2*i/n;return`<circle cx="${(cx+r*Math.cos(a)).toFixed(1)}" cy="${(cy+r*Math.sin(a)).toFixed(1)}" r="2.5"/>`;}).join('');}
function hexP(cx,cy,r){return Array.from({length:6},(_,i)=>{const a=Math.PI/180*(60*i-30);return`${cx+r*Math.cos(a)},${cy+r*Math.sin(a)}`;}).join(' ');}
function grid(w,h,s){let d='';for(let x=0;x<=w;x+=s)d+=`<line x1="${x}" y1="0" x2="${x}" y2="${h}"/>`;for(let y=0;y<=h;y+=s)d+=`<line x1="0" y1="${y}" x2="${w}" y2="${y}"/>`;return d;}

const ABS={
  securitizacao:{label:'Crédito',svg:`<svg xmlns="http://www.w3.org/2000/svg" width="390" height="390"><rect fill="#09081A" width="390" height="390"/><g opacity=".18" stroke="#C9A84C" stroke-width=".8"><line x1="60" y1="80" x2="180" y2="160"/><line x1="180" y1="160" x2="300" y2="100"/><line x1="300" y1="100" x2="330" y2="220"/><line x1="180" y1="160" x2="220" y2="280"/><line x1="220" y1="280" x2="330" y2="220"/><line x1="100" y1="300" x2="220" y2="280"/><line x1="60" y1="80" x2="100" y2="300"/><line x1="100" y1="300" x2="180" y2="360"/></g><g fill="#C9A84C" opacity=".35"><circle cx="60" cy="80" r="3.5"/><circle cx="180" cy="160" r="5"/><circle cx="300" cy="100" r="3.5"/><circle cx="330" cy="220" r="4"/><circle cx="220" cy="280" r="5"/><circle cx="100" cy="300" r="3.5"/></g></svg>`},
  'real-estate':{label:'Real Estate',svg:`<svg xmlns="http://www.w3.org/2000/svg" width="390" height="390"><rect fill="#09081A" width="390" height="390"/><g opacity=".14" stroke="#C9A84C" stroke-width=".7" fill="none"><rect x="50" y="160" width="100" height="160"/><rect x="65" y="178" width="26" height="32"/><rect x="108" y="178" width="26" height="32"/><rect x="65" y="224" width="26" height="32"/><rect x="108" y="224" width="26" height="96"/><rect x="200" y="120" width="140" height="200"/><rect x="218" y="146" width="34" height="40"/><rect x="284" y="146" width="34" height="40"/><rect x="218" y="204" width="34" height="40"/><rect x="284" y="204" width="34" height="40"/><rect x="218" y="262" width="34" height="58"/><rect x="284" y="262" width="34" height="58"/><line x1="0" y1="320" x2="390" y2="320" stroke-width="1.2"/><line x1="50" y1="160" x2="100" y2="118"/><line x1="150" y1="160" x2="100" y2="118"/><line x1="200" y1="120" x2="270" y2="70"/><line x1="340" y1="120" x2="270" y2="70"/></g><g fill="#C9A84C" opacity=".3"><circle cx="100" cy="118" r="2.5"/><circle cx="270" cy="70" r="2.5"/></g></svg>`},
  mineracao:{label:'Mineração',svg:(()=>{const h=[[195,195],[127,172],[263,172],[195,149],[127,218],[263,218],[59,195],[331,195]].map(([cx,cy])=>`<polygon points="${hexP(cx,cy,40)}"/>`).join('');return`<svg xmlns="http://www.w3.org/2000/svg" width="390" height="390"><rect fill="#09081A" width="390" height="390"/><g opacity=".15" stroke="#C9A84C" stroke-width=".7" fill="none">${h}</g><polygon points="${hexP(195,195,40)}" fill="#C9A84C" opacity=".07"/><g fill="#C9A84C" opacity=".28"><circle cx="195" cy="155" r="2.5"/><circle cx="195" cy="235" r="2.5"/></g></svg>`;})()},
  'ma-crossborder':{label:'M&amp;A Cross',svg:`<svg xmlns="http://www.w3.org/2000/svg" width="390" height="390"><rect fill="#09081A" width="390" height="390"/><g opacity=".1" stroke="#7A8FA8" stroke-width=".5" fill="none"><ellipse cx="195" cy="195" rx="140" ry="140"/><ellipse cx="195" cy="195" rx="140" ry="70"/><ellipse cx="195" cy="195" rx="140" ry="35"/><ellipse cx="195" cy="195" rx="70" ry="140"/><line x1="55" y1="195" x2="335" y2="195"/><line x1="195" y1="55" x2="195" y2="335"/></g><g fill="#C9A84C" opacity=".28"><circle cx="90" cy="140" r="3"/><circle cx="300" cy="125" r="3"/><circle cx="265" cy="275" r="3"/><circle cx="130" cy="285" r="3"/></g><g opacity=".16" stroke="#C9A84C" stroke-width=".8" fill="none" stroke-dasharray="3,4"><line x1="90" y1="140" x2="300" y2="125"/><line x1="300" y1="125" x2="265" y2="275"/><line x1="265" y1="275" x2="130" y2="285"/><line x1="130" y1="285" x2="90" y2="140"/></g></svg>`},
  tokenizacao:{label:'Token',svg:`<svg xmlns="http://www.w3.org/2000/svg" width="390" height="390"><rect fill="#09081A" width="390" height="390"/><g opacity=".1" stroke="#C9A84C" stroke-width=".5" fill="none">${grid(390,390,39)}</g><g opacity=".22" stroke="#C9A84C" stroke-width=".8" fill="none"><rect x="135" y="135" width="120" height="120" rx="3"/><rect x="150" y="152" width="32" height="32" rx="2"/><rect x="208" y="152" width="32" height="32" rx="2"/><rect x="150" y="196" width="32" height="32" rx="2"/><rect x="208" y="196" width="32" height="32" rx="2"/><rect x="150" y="240" width="90" height="16" rx="2"/></g><g fill="#C9A84C" opacity=".28"><circle cx="135" cy="135" r="3"/><circle cx="255" cy="135" r="3"/><circle cx="255" cy="255" r="3"/><circle cx="135" cy="255" r="3"/></g></svg>`},
  partners:{label:'Partners',svg:`<svg xmlns="http://www.w3.org/2000/svg" width="390" height="390"><rect fill="#09081A" width="390" height="390"/><g opacity=".12" stroke="#C9A84C" stroke-width=".7" fill="none">${radLines(195,195,16,145)}</g><g opacity=".08" fill="none" stroke="#C9A84C" stroke-width=".5"><circle cx="195" cy="195" r="50"/><circle cx="195" cy="195" r="90"/><circle cx="195" cy="195" r="130"/></g><g fill="#C9A84C" opacity=".3"><circle cx="195" cy="195" r="5"/>${radDots(195,195,90,12)}${radDots(195,195,130,8)}</g></svg>`}
};

const CAPS={securitizacao:'Securitização e Mercado de Capitais','real-estate':'Real Estate Estruturado',mineracao:'Mineração e Commodities','ma-crossborder':'M&A e Negócios Cross-Border',tokenizacao:'Tokenização de Ativos Reais',partners:'Rede de Partners'};

const S={tema:'securitizacao',tipo:'citacao',handle:'@eujoaolemosnetto',tag:'',hl:'',body:'',footer:'',bg:{type:'abs',key:'securitizacao',data:null},bank:[]};
try{S.bank=JSON.parse(localStorage.getItem('v3-ig-bank')||'[]');}catch(e){}

function s2uri(s){return'data:image/svg+xml,'+encodeURIComponent(s);}

// ABS GRID
function renderAbs(){
  const g=document.getElementById('abs-grid');g.innerHTML='';
  Object.entries(ABS).forEach(([key,a])=>{
    const d=document.createElement('div');
    d.className='at'+(S.bg.type==='abs'&&S.bg.key===key?' sel':'');
    d.style.cssText=`background:url("${s2uri(a.svg)}") center/cover no-repeat;position:relative;overflow:hidden;aspect-ratio:1;`;
    d.innerHTML=`<div class="al">${a.label}</div>`;
    d.addEventListener('click',()=>{S.bg={type:'abs',key,data:null};renderAbs();renderBank();renderPost();});
    g.appendChild(d);
  });
}

// BANK
function renderBank(){
  const g=document.getElementById('bank-grid'),e=document.getElementById('be');
  if(!S.bank.length){g.innerHTML='';g.appendChild(e);return;}
  g.innerHTML='';
  S.bank.forEach((item,i)=>{
    const d=document.createElement('div');
    d.className='bt'+(S.bg.type==='bank'&&S.bg.key===i?' sel':'');
    d.innerHTML=`<img src="${item.data}"><div class="bd">✕</div>`;
    d.addEventListener('click',ev=>{
      if(ev.target.classList.contains('bd')){
        S.bank.splice(i,1);localStorage.setItem('v3-ig-bank',JSON.stringify(S.bank));
        if(S.bg.type==='bank'&&S.bg.key===i)S.bg={type:'abs',key:S.tema,data:null};
        renderBank();renderAbs();renderPost();
      }else{S.bg={type:'bank',key:i,data:item.data};renderBank();renderAbs();renderPost();}
    });
    g.appendChild(d);
  });
}

// UPLOAD
const uz=document.getElementById('uz'),fi=document.getElementById('fi');
uz.addEventListener('click',()=>fi.click());
uz.addEventListener('dragover',e=>{e.preventDefault();uz.style.borderColor='rgba(201,168,76,.5)';});
uz.addEventListener('dragleave',()=>uz.style.borderColor='');
uz.addEventListener('drop',e=>{e.preventDefault();uz.style.borderColor='';doFile(e.dataTransfer.files[0]);});
fi.addEventListener('change',()=>doFile(fi.files[0]));
function doFile(f){
  if(!f||!f.type.startsWith('image/'))return toast('Arquivo inválido');
  if(f.size>8*1024*1024)return toast('Imagem maior que 8MB');
  const r=new FileReader();
  r.onload=e=>{const item={name:f.name,data:e.target.result};S.bank.push(item);localStorage.setItem('v3-ig-bank',JSON.stringify(S.bank));S.bg={type:'bank',key:S.bank.length-1,data:item.data};renderBank();renderAbs();switchTab('bco');renderPost();toast('Imagem adicionada');};
  r.readAsDataURL(f);
}

// TABS
function switchTab(id){
  document.querySelectorAll('.itab').forEach(t=>t.classList.toggle('active',t.dataset.tab===id));
  document.querySelectorAll('.itp').forEach(p=>p.classList.toggle('active',p.id===`tab-${id}`));
}
document.querySelectorAll('.itab').forEach(t=>t.addEventListener('click',()=>switchTab(t.dataset.tab)));

// POST GENERATOR
function getBgStyle(){
  if(S.bg.type==='abs'){const a=ABS[S.bg.key]||ABS.securitizacao;return`background:url("${s2uri(a.svg)}") center/cover no-repeat;`;}
  if(S.bg.type==='bank'&&S.bg.data)return`background:url("${S.bg.data}") center/cover no-repeat;`;
  return'background:#09081A;';
}

function generatePostHTML(forExport=false){
  const tag=S.tag||'';
  const hl=S.hl||'Headline do post';
  const body=S.body||'';
  const footer=S.footer||'V3 Partners';
  const handle=S.handle.replace('@','');
  const bgS=getBgStyle();
  const overlay=S.bg.type!=='none'?'<div style="position:absolute;inset:0;background:rgba(9,8,26,.52);z-index:0;"></div>':'';
  const size=forExport?'1080px':'390px';

  return`<div style="width:${size};height:${size};${bgS}position:relative;overflow:hidden;font-family:\'DM Sans\',sans-serif;">
  ${overlay}
  <div style="position:absolute;inset:0;z-index:1;display:flex;flex-direction:column;justify-content:flex-end;padding:${forExport?'56px':'20px'};">
    ${tag?`<span style="font-size:${forExport?'22px':'8px'};font-weight:700;letter-spacing:${forExport?'4px':'2px'};text-transform:uppercase;color:#C9A84C;display:block;margin-bottom:${forExport?'18px':'6px'};">${tag}</span>`:''}
    <h2 style="font-size:${forExport?'68px':'24px'};font-weight:800;color:#F0ECE4;line-height:1.1;letter-spacing:-1px;margin-bottom:${body?forExport?'22px':'8px':'0'};">${hl}</h2>
    ${body?`<p style="font-size:${forExport?'28px':'10px'};color:rgba(240,236,228,.7);line-height:1.55;margin-bottom:${forExport?'28px':'10px'};">${body}</p>`:''}
    <div style="display:flex;align-items:center;justify-content:space-between;border-top:1px solid rgba(201,168,76,.2);padding-top:${forExport?'20px':'7px'};">
      <span style="font-size:${forExport?'22px':'8px'};font-weight:700;letter-spacing:${forExport?'3px':'1px'};text-transform:uppercase;color:rgba(201,168,76,.7);">@${handle}</span>
      <span style="font-size:${forExport?'20px':'7px'};color:rgba(240,236,228,.4);text-transform:uppercase;letter-spacing:1px;">${footer}</span>
    </div>
  </div>
</div>`;
}

function renderPost(){
  document.getElementById('post-preview').innerHTML=generatePostHTML(false);
  const h=S.handle.replace('@','');
  document.getElementById('ig-name').textContent=h;
  document.getElementById('cap-h').textContent=h;
  document.getElementById('cap-t').textContent=CAPS[S.tema]||'V3 Partners';
}

function buildFullHTML(){
  const handle=S.handle.replace('@','');
  const postHTML=generatePostHTML(true).replace(/width:1080px;height:1080px/,'width:1080px;height:1350px');
  return`<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Post Instagram — @${handle} — V3 Partners</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}body{background:#09081A;display:flex;align-items:center;justify-content:center;min-height:100vh;}</style>
</head>
<body>${postHTML}</body>
</html>`;
}

let dbt;
function db(){clearTimeout(dbt);dbt=setTimeout(renderPost,250);}

// CONTROLS
document.getElementById('sel-tema').addEventListener('change',e=>{S.tema=e.target.value;if(S.bg.type==='abs')S.bg.key=e.target.value;renderAbs();renderBank();renderPost();});
document.getElementById('sel-tipo').addEventListener('change',e=>{S.tipo=e.target.value;renderPost();});
document.getElementById('inp-handle').addEventListener('input',e=>{S.handle=e.target.value;document.getElementById('ig-name').textContent=e.target.value.replace('@','');document.getElementById('cap-h').textContent=e.target.value.replace('@','');db();});
document.getElementById('inp-tag').addEventListener('input',e=>{S.tag=e.target.value;db();});
document.getElementById('inp-hl').addEventListener('input',e=>{S.hl=e.target.value;db();});
document.getElementById('inp-body').addEventListener('input',e=>{S.body=e.target.value;db();});
document.getElementById('inp-footer').addEventListener('input',e=>{S.footer=e.target.value;db();});
document.getElementById('btn-gerar').addEventListener('click',()=>{renderPost();toast('Preview atualizado');});
document.getElementById('btn-dl').addEventListener('click',()=>{
  const blob=new Blob([buildFullHTML()],{type:'text/html'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download=`ig-post-v3-${S.tema}-${Date.now()}.html`;a.click();toast('HTML baixado');
});

document.getElementById('btn-export-png').addEventListener('click', async ()=>{
  const btn=document.getElementById('btn-export-png');
  const prog=document.getElementById('exp-prog');
  const bar=document.getElementById('exp-bar');
  const label=document.getElementById('exp-label');
  const preview=document.getElementById('post-preview');

  btn.disabled=true;
  prog.style.display='block';
  bar.style.width='30%';
  label.textContent='Renderizando post...';
  await new Promise(r=>setTimeout(r,200));

  try{
    bar.style.width='60%';
    const canvas=await html2canvas(preview,{
      width:390,
      height:390,
      scale:1080/390,
      useCORS:true,
      allowTaint:true,
      logging:false,
      backgroundColor:'#09081A'
    });
    bar.style.width='90%';
    await new Promise(r=>setTimeout(r,150));
    const a=document.createElement('a');
    a.download=`v3-ig-post-${S.tema}-${Date.now()}.png`;
    a.href=canvas.toDataURL('image/png');
    a.click();
    bar.style.width='100%';
    label.textContent='PNG exportado.';
    toast('PNG baixado — 1080×1080px');
  }catch(e){
    label.textContent='Erro: '+e.message;
    toast('Erro ao exportar');
  }

  btn.disabled=false;
  setTimeout(()=>{ prog.style.display='none'; bar.style.width='0%'; },3000);
});

function copyHTML(){navigator.clipboard.writeText(buildFullHTML()).then(()=>toast('HTML copiado'));}
document.getElementById('btn-copy').addEventListener('click',copyHTML);

function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2400);}

renderAbs();renderBank();renderPost();
</script>
</body>
</html>
